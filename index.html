    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
      }
      :root {
        --head-x: 0;
        --head-y: 0;
      }
      * {
        -webkit-font-smoothing: antialiased;

      }
      #root {
        transform: translate3d(0,0,0);
        backface-visibility: hidden;
        perspective: 1000px;
      }
      .parallax-layer {
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }
    </style>
